<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 입지 - Weather Outfit</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="app">
    <header class="app-header-new">
      <div class="top-row">
        <div class="current-location-title" id="current-location-title">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--primary)" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <span id="header-location-name"></span>
        </div>
        <div class="lang-toggle-pill" id="lang-toggle-pill">
          <button id="lang-ko-btn" class="lang-btn">KOR</button>
          <button id="lang-en-btn" class="lang-btn">ENG</button>
        </div>
      </div>
      
      <p class="eyebrow" id="main-eyebrow">오늘 뭐 입지?</p>

      <div class="location-tabs-container">
        <div class="location-tabs" id="location-tabs"></div>
      </div>
    </header>

    <section class="search-section" id="search-section" hidden>
      <form id="location-form">
        <div class="search-input-container">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <div class="input-group">
            <input id="location-input" name="location" type="text" placeholder="" autocomplete="off" />
            <ul id="autocomplete-list" class="autocomplete-list" hidden></ul>
          </div>
        </div>
      </form>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div class="date-toggle-full" id="date-toggle-full">
      <button id="date-today-btn" class="date-btn active">오늘</button>
      <button id="date-tomorrow-btn" class="date-btn">내일</button>
    </div>

    <section id="cards" class="cards"></section>

    <div style="text-align: center; margin: 32px 0;">
      <button id="refresh-button" type="button" class="btn btn-icon outline-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M21.5 2v6h-6" />
          <path d="M21.34 15.57a10 10 0 1 1-.59-8.4L21.5 8" />
        </svg>
        새로고침
      </button>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>

</html>
